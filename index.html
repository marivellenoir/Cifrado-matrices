<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Secretos en Matrices</title>
        <link rel="stylesheet" href="estilos.css">
    </head>
    <body>

        <main>
            <!-- Cuerpo del proyecto -->

    <section class="card card-encriptar">
        <h2>Encriptar Mensaje</h2>
        <label for="mensajetexto">Escribe tu mensaje</label>
        <textarea id="mensajetexto"></textarea>
        <label for="tamano-matriz">Tamaño de la matriz clave</label>
        <input type="number" id="tamano-matriz" min="2" max="10" value="3">
        <button id="btnEncriptar" class="btn-main">Encriptar</button>
        <p id="resultadoEncriptado" class="output"></p>
        <button id="btnCopiarEncriptado" class="btn-outline">Copiar resultado</button>
    </section>

    <section class="card card-desencriptar">
        <h2>Desencriptar Mensaje</h2>
        <label for="numeroscifrados">Pega o Escribe los numeros cifrados</label>
        <textarea id="numeroscifrados"></textarea>
        <button id="btnDesencriptar" class="btn-main">Desencriptar</button>
        <p id="resultadoDesencriptado" class="output"></p>
        <button id="btnCopiarDesencriptado" class="btn-outline">Copiar resultado</button>
    </section>

    <section class="card card-tabla">
        <h2>Tabla de Codificacion</h2>
        <table id="tablaCodigos"></table>
    </section>

    <section class="card card-video">
        <h2>Aqui tienes un video donde podemos ver una breve
            explicacion de como funciona el cifrado con matrices</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/_phKSd1oR0w?si=hRbmzPduIYAhi7Eo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>

</main>
        <script src="script.js"></script>
    </body>
</html>
